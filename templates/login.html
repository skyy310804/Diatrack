{% extends "auth_base.html" %}

{% block content %}

<div class="form-card">

    <div class="text-center mb-4">

    <i class="bi bi-heart-pulse-fill login-logo"></i>

    <h2 class="mt-3 fw-bold">

        Welcome!

    </h2>

    <p class="text-muted">

        Login Your Account.

    </p>

</div>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required>

        </div>

        <div class="form-check mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                name="remember"
                id="remember">

            <label
                class="form-check-label"
                for="remember">

                Remember Me

            </label>

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

    <hr>

    <p class="text-center mb-0">

    Don't have an account?

    <a class="auth-link" href="{{ url_for('auth.sign_up') }}">

        Create Account

    </a>

</p>

</div>

{% endblock %}

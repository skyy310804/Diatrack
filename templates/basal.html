{% extends "base.html" %}

{% block content %}

<div class="page-header mb-4">

    <h2>
        <i class="bi bi-droplet-half text-primary"></i>
        Basal Insulin
    </h2>

    <p class="text-muted">
        Configure your simulated basal insulin delivery.
    </p>

</div>

<div class="card tracker-card">

    <div class="card-body">
        <div class="alert alert-primary mb-4">

    <h5>

        <i class="bi bi-droplet-half"></i>

        Current Basal Rate

    </h5>

    <h2>

        {{ user.basal_rate }}

        <small>Units / Hour</small>

    </h2>

    <p class="mb-0">

        Pump Status:
        <span class="badge bg-success">

            Running

        </span>

    </p>

</div>
        <form method="POST">

            <label class="mb-2">
                Basal Rate (Units / Hour)
            </label>

            <input
                type="number"
                step="0.1"
                name="basal_rate"
                class="form-control"
                placeholder="Example: 1.0"
                required>

            <button class="btn btn-primary mt-3">

                <i class="bi bi-save"></i>

                Save Basal Rate

            </button>

        </form>

    </div>

</div>

{% endblock %}

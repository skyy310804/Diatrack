{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card graph-card avatar-card">

        <div class="card-body">

            <h2 class="mb-4">
                <i class="bi bi-person-circle"></i>
                Choose Your Avatar
            </h2>

            <form method="POST">

                <div class="row g-4">

                    {% for avatar in avatars %}

                    <div class="col-6 col-md-3 text-center">

                        <label class="avatar-option">

                            <input
                                type="radio"
                                name="avatar"
                                value="{{ avatar }}"
                                {% if user.avatar == avatar %}checked{% endif %}
                                hidden>

                            <img
                                src="{{ url_for('static', filename='images/avatars/' + avatar) }}"
                                class="avatar-picker">

                        </label>

                    </div>

                    {% endfor %}

                </div>

                <div class="d-flex flex-column flex-md-row justify-content-center gap-3">

    <a href="{{ url_for('views.profile') }}"
       class="btn btn-outline-secondary btn-lg px-4">

        <i class="bi bi-arrow-left"></i>

        Cancel

    </a>

    <button type="submit"
            class="btn btn-primary btn-lg px-4">

        <i class="bi bi-check-circle"></i>

        Save Avatar

    </button>

</div>

{% endblock %}

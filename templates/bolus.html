{% extends "base.html" %}

{% block content %}

<div class="page-header mb-4">

    <h2>

        <i class="bi bi-lightning-charge-fill text-warning"></i>

        Bolus Calculator

    </h2>

    <p class="text-muted">

        Calculate a recommended meal bolus.

    </p>

</div>

<div class="card tracker-card">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label>

                    Current Glucose (mg/dL)

                </label>

                <input
                    type="number"
                    name="glucose"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label>

                    Carbohydrates (grams)

                </label>

                <input
                    type="number"
                    name="carbs"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-primary">

                <i class="bi bi-calculator"></i>

                Calculate Bolus

            </button>

        </form>
{% if recommended %}

<hr class="my-4">

<div class="alert alert-success text-center">

    <h5>

        <i class="bi bi-check-circle-fill"></i>

        Recommended Bolus

    </h5>

    <h1 class="display-4">

        {{ recommended }}

    </h1>

    <p>

        Units of Rapid-Acting Insulin

    </p>

    <div class="mt-3">

        <small>

            Based on

            <strong>{{ carbs }} g</strong>

            carbohydrates

            and

            <strong>{{ glucose }} mg/dL</strong>

            glucose.

        </small>

    </div>

</div>

{% endif %}
    </div>

</div>

{% endblock %}

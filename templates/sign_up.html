{% extends "auth_base.html" %}

{% block content %}

<div class="form-card">

    <h2 class="text-center fw-bold mb-2">

        Create Account

    </h2>

    <p class="text-center text-muted mb-4">

        Create your DiaTrack account

    </p>

    <form method="POST">

        <div class="row">

            <div class="col">

                <label class="form-label">

                    First Name

                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    placeholder="Juan"
                    required>

            </div>

            <div class="col">

                <label class="form-label">

                    Last Name

                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    placeholder="Dela Cruz"
                    required>

            </div>

        </div>

        <div class="mt-3">

            <label class="form-label">

                Email Address

            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="example@email.com"
                required>

        </div>

        <div class="mt-3">

            <label class="form-label">

                Password

            </label>

            <input
                type="password"
                name="password1"
                class="form-control"
                placeholder="Enter password"
                required>

        </div>

        <div class="mt-3">

            <label class="form-label">

                Confirm Password

            </label>

            <input
                type="password"
                name="password2"
                class="form-control"
                placeholder="Confirm password"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary mt-4">

            <i class="bi bi-person-plus-fill"></i>

            Create Account

        </button>

    </form>

    <hr>

    <p class="text-center mb-0">

        Already have an account?

        <a class="auth-link" href="{{ url_for('auth.login') }}">
        Login
        </a>

    </p>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}


<div class="container-fluid">

<div class="page-header mb-4">

    <h2>
        <i class="bi bi-person-circle text-primary"></i>
        Edit Profile
    </h2>

    <p class="text-muted">
        Update your personal information.
    </p>

</div>

    <div class="card tracker-card">
    <div class="card-body p-4">

        <form method="POST" enctype="multipart/form-data">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        class="form-control"
                        value="{{ user.first_name }}"
                        required>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        class="form-control"
                        value="{{ user.last_name }}"
                        required>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="form-select">

                        <option value="">Select Gender</option>

                        <option value="Male"
                            {% if user.gender=="Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if user.gender=="Female" %}selected{% endif %}>
                            Female
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Birthday
                    </label>

                    <input
                        type="date"
                        name="birthday"
                        class="form-control"
                        value="{{ user.birthday.strftime('%Y-%m-%d') if user.birthday else '' }}">

                </div>
                
               <div class="d-flex justify-content-center gap-3 mt-3">

    <button
        type="submit"
        class="btn btn-primary btn-lg">

        <i class="bi bi-check-circle me-2"></i>

        Save Changes

    </button>

    <a
        href="{{ url_for('views.profile') }}"
        class="btn btn-outline-secondary btn-lg ms-2">

        Cancel

    </a>

</div>

        </form>

    </div>

</div>

{% endblock %}
